name: Archive OKX data and update trackers

# OKX keeps 15-minute open interest and taker volume for about two weeks.
# This saves each completed UTC day to the `data` branch so the sample keeps
# growing, then follows every tracker in trackers/ on that data and writes
# tracking/results.json for the website. Public market data only; no
# credentials are used.

on:
  schedule:
    - cron: '20 1 * * *' # 01:20 UTC, after the previous day's last bar is published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-okx
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history: a tracker starts counting from the commit that last changed its file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check out the data branch
        run: |
          if git rev-parse --verify --quiet origin/data > /dev/null; then
            git worktree add -B data data-branch origin/data
          else
            git worktree add --orphan -b data data-branch
          fi

      - name: Download the days that are not archived yet
        run: node backtest/fetch-okx.mjs --archive data-branch/okx --top 80

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Update trackers
        run: |
          npx esbuild backtest/track.ts --bundle --platform=node --format=esm --log-level=warning --outfile="$RUNNER_TEMP/track.mjs"
          node "$RUNNER_TEMP/track.mjs" --trackers trackers --archive data-branch/okx --out data-branch/tracking/results.json

      - name: Commit
        working-directory: data-branch
        run: |
          git add okx tracking
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Archive OKX data through $(ls okx | tail -1 | cut -c1-10) and update trackers"
          git push origin data
